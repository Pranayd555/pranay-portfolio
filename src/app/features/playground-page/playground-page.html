<div class="flex min-h-screen flex-col bg-background-light dark:bg-background-dark">
  <app-detail-bar />
  <main class="flex flex-1 flex-col min-h-0 pt-14 sm:pt-16">
    <div class="relative flex-1 min-h-[50vh] flex flex-col">
    @switch (selectedId()) {
    @case ('hero-icon-particles') {
      <div class="relative flex-1 min-h-0 bg-background-dark">
        <app-hero-icon-particles></app-hero-icon-particles>
      </div>
    }
    @case ('spinning-sphere') {
      <div class="relative flex-1 min-h-0">
        <app-background-animation-three [embedded]="true"></app-background-animation-three>
      </div>
    }
    @case ('slide-particle-bg') {
      <div class="relative flex-1 min-h-0 bg-background-dark">
        <app-slide-particle-bg></app-slide-particle-bg>
      </div>
    }
    @case ('about-particle-bg') {
      <div class="relative flex-1 min-h-0 bg-background-dark">
        <app-about-particle-bg></app-about-particle-bg>
      </div>
    }
    @case ('wave-particle-bg') {
      <div class="relative flex-1 min-h-0 bg-background-dark">
        <app-wave-particle-bg></app-wave-particle-bg>
      </div>
    }
    @case ('text-scrapper-animation') {
      <div class="relative flex-1 min-h-0">
        <app-text-scrapper-animation />
      </div>
    }
  }
  </div>

  <nav
    class="playground-nav custom-scrollbar flex flex-none flex-nowrap justify-center gap-1.5 sm:gap-2 overflow-x-auto py-3 px-3 sm:px-4 mt-4
           bg-background-dark/75 dark:bg-background-dark/85 backdrop-blur-md border-t border-white/5"
    aria-label="Playground animation picker"
  >
    @for (anim of animations; track anim.id) {
      <button
        type="button"
        class="playground-nav-btn flex-shrink-0 h-9 sm:h-10 rounded-full px-3 sm:px-5 text-xs sm:text-sm font-medium
               text-neutral-50 transition-all duration-200 cursor-pointer
               bg-cyan-500/90 hover:bg-cyan-500 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-cyan-400/60 focus-visible:ring-offset-2 focus-visible:ring-offset-background-dark
               dark:bg-cyan-500/90 dark:hover:bg-cyan-500"
        [ngClass]="{
          '!bg-orange-500 !hover:bg-orange-500 dark:!bg-orange-500 dark:!hover:bg-orange-500 ring-2 ring-white/30': selectedId() === anim.id
        }"
        (click)="select(anim.id)"
      >
        {{ anim.label }}
      </button>
    }
  </nav>
  </main>
</div>
