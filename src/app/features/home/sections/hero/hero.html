<section id="hero" class="px-4 py-12 md:py-20 min-h-screen flex items-center justify-center relative overflow-hidden">
  <div class="max-w-4xl mx-auto w-full z-10 flex flex-col items-center gap-10 md:gap-14">
    <!-- Profile & Name -->
    <div class="flex flex-col items-center gap-6 md:gap-8 text-center">
      <div class="relative group draggable-wrapper">
        <div class="relative w-32 h-32 md:w-48 md:h-48 bg-transparent text-slate-900 dark:text-white">
          <img
            src="assets/1000006812-removebg-preview.png"
            alt="Pranay Das"
            loading="lazy"
            class="w-full h-full object-cover" />
        </div>
      </div>

      <div class="space-y-4 md:space-y-6">
        <div class="h-8">
          <span
            class="inline-block px-3 py-1 md:px-4 md:py-1.5 rounded-full bg-white/80 dark:bg-slate-900/50 backdrop-blur-md border border-primary/30 text-cyan-700 dark:text-secondary text-xs md:text-sm font-bold uppercase tracking-[0.2em] shadow-[0_0_15px_rgba(19,91,236,0.3)]">
            {{ currentRole() }}<span class="animate-pulse">|</span>
          </span>
        </div>

        <p class="text-primary dark:text-secondary text-lg md:text-xl font-medium animate-slide-up"
          [style.animation-delay]="'0.1s'"
          >{{ tagline }}</p>
      </div>
    </div>

    <!-- Intro -->
    <div class="space-y-6 text-slate-600 dark:text-slate-400 text-base md:text-lg leading-relaxed animate-slide-up"
      style="animation-delay: 0.15s;">
      <p>
        {{ intro.greeting }} {{ intro.role }}
      </p>
      <p>{{ intro.focus }}</p>
      <p>{{ intro.experience }}</p>
      <p>{{ intro.philosophy }}</p>
    </div>


    <!-- Closing -->
    <div class="space-y-4 animate-slide-up text-center" style="animation-delay: 0.45s;">
      <p class="text-xl md:text-2xl font-bold text-primary dark:text-secondary">
        {{ closing.mindset }}
      </p>
      <p class="text-slate-600 dark:text-slate-400 leading-relaxed max-w-2xl mx-auto">
        {{ closing.paragraph }}
      </p>
      <p class="text-slate-600 dark:text-slate-400 leading-relaxed max-w-2xl mx-auto">
        {{ closing.final }}
      </p>
    </div>

  </div>
</section>
