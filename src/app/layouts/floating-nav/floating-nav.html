<!-- Overlay: always in DOM, visibility toggled via class -->
<div
  class="nav-overlay"
  [class.visible]="navOpen() || chatOpen()"
  (click)="closeNav()"
  (keydown.escape)="closeNav()">
</div>

<!-- Trigger pill -->
 <div class="flex justify-between w-full">
<button
  class="nav-trigger"
  [class.open]="navOpen()"
  (click)="toggleNav()"
  aria-label="Toggle navigation"
  [attr.aria-expanded]="navOpen()">
  <span class="material-symbols-outlined t-icon">explore</span>
  <span class="t-label hidden md:inline">{{ navOpen() ? 'close' : 'navigate' }}</span>
  <span class="material-symbols-outlined t-chevron hidden md:inline">keyboard_arrow_up</span>
</button>

<!-- chat bot button -->
 <button
    type="button"
    aria-label="Open chat bot"
    class="chat-float chat-ripple fixed bottom-8 right-8 z-50 grid h-20 w-20 place-items-center rounded-full bg-teal-500 text-white shadow-2xl shadow-teal-950/60 transition duration-300 ease-out hover:scale-110 hover:bg-teal-400 focus:outline-none focus:ring-4 focus:ring-teal-300/50 active:scale-95 cursor-pointer"
    (click)="toggleChat()"
  >

    <span class="relative flex h-11 w-12 items-center justify-center rounded-2xl bg-white text-teal-600 shadow-inner">
      <span class="absolute -bottom-1.5 right-3 h-4 w-4 rotate-45 rounded-sm bg-white"></span>
      <span class="relative z-10 flex items-center gap-1">
        <span class="typing-dot h-2 w-2 rounded-full bg-teal-500"></span>
        <span class="typing-dot h-2 w-2 rounded-full bg-teal-500"></span>
        <span class="typing-dot h-2 w-2 rounded-full bg-teal-500"></span>
      </span>
    </span>
  </button>
</div>

<!-- Panel: always in DOM, shown/hidden via class for CSS transitions to work -->
<div
  #navPanel
  class="nav-panel"
  [class.show]="navOpen()"
  aria-label="Site navigation">

  <!-- Header -->
  <div class="panel-head">
    <div class="panel-head-label">
      <span class="material-symbols-outlined ms">account_tree</span>
      Navigation
    </div>
    <button class="close-btn" (click)="closeNav()" aria-label="Close">
      <span class="material-symbols-outlined">close</span>
    </button>
  </div>

  <!-- Nav list -->
  <nav class="nav-list">

    <!-- About -->
    <div class="nav-item">
      <a class="nav-link" [routerLink]="['/about']" routerLinkActive="active" (click)="closeNav()">
        <span class="material-symbols-outlined ni">person</span>
        <div class="nav-label">
          <span class="nav-title">About</span>
          <span class="nav-sub">Enter the story</span>
        </div>
      </a>
    </div>

    <!-- Projects -->
    <div class="nav-item">
      <button
        class="nav-btn"
        [class.active]="isProjectsRouteActive()"
        (click)="toggleProjects()">
        <span class="material-symbols-outlined ni">construction</span>
        <div class="nav-label">
          <span class="nav-title">Projects</span>
          <span class="nav-sub">Hands on crafts</span>
        </div>
        <span
          class="material-symbols-outlined proj-chevron"
          [class.open]="projOpen()">
          expand_more
        </span>
      </button>

      <!-- Submenu: always in DOM, toggled via .open class for grid transition -->
      <div class="submenu-wrap" [class.open]="projOpen()">
        <div class="submenu-inner">
          <div class="submenu-list">

            @for (project of projects; track project.slug) {
              <a class="sub-link" [routerLink]="['/', 'projects', project.slug]" routerLinkActive="active" (click)="closeNav()">
                <span class="material-symbols-outlined ni">description</span>
                <div class="sub-label">
                  <span class="sub-title">{{project.title}}</span>
                  <span class="sub-sub">{{project.subtitle}}</span>
                </div>
              </a>
            }

          </div>
        </div>
      </div>
    </div>

    <!-- Experience -->
    <div class="nav-item">
      <a class="nav-link" [routerLink]="['/experience']" routerLinkActive="active" (click)="closeNav()">
        <span class="material-symbols-outlined ni">timeline</span>
        <div class="nav-label">
          <span class="nav-title">Experience</span>
          <span class="nav-sub">The timeline</span>
        </div>
      </a>
    </div>

    <!-- Contact -->
    <div class="nav-item">
      <a class="nav-link" [routerLink]="['/contact']" routerLinkActive="active" (click)="closeNav()">
        <span class="material-symbols-outlined ni">mail</span>
        <div class="nav-label">
          <span class="nav-title">Contact</span>
          <span class="nav-sub">Let's talk</span>
        </div>
      </a>
    </div>

    <!-- Playground -->
    <div class="nav-item">
      <div class="nav-divider"></div>
      <a class="playground-link" [routerLink]="['/playground']" routerLinkActive="active" (click)="closeNav()">
        <span class="material-symbols-outlined ni">science</span>
        <div class="nav-label">
          <span class="nav-title">Playground</span>
          <span class="nav-sub">Tinker mode</span>
        </div>
        <span class="lab-badge">lab</span>
      </a>
    </div>

  </nav>

  <div class="panel-foot hidden md:block">Press <kbd>Esc</kbd> to close</div>

</div>
@if(chatOpen()) {
<app-chat #chatModal [show]="chatOpen()" (isCloseModal)="closeChat($event)" />
}
