@if (show()) {
  <div
    class="fixed z-50 left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-[calc(100vw-2rem)] h-[calc(100vh-4rem)] max-h-[750px] md:left-auto md:bottom-24 md:right-24 md:top-auto md:translate-x-0 md:translate-y-0 md:w-[450px] md:h-[550px] bg-slate-900/80 backdrop-blur-xl border border-purple-500/20 rounded-2xl shadow-[0_0_50px_-12px_rgba(168,85,247,0.2)] flex flex-col overflow-hidden"
  >
    <div
      class="h-[2px] w-full bg-gradient-to-r from-transparent via-purple-500 to-cyan-400 absolute top-0 left-0 animate-pulse"
    ></div>

    <div
      class="px-5 py-3 md:px-6 md:py-4 border-b border-slate-800 flex items-center justify-between bg-slate-950/40"
    >
      <div class="flex items-center gap-3">
        <div class="relative flex h-3 w-3">
          <span
            class="animate-ping absolute inline-flex h-full w-full rounded-full bg-purple-400 opacity-75"
          ></span>
          <span class="relative inline-flex rounded-full h-3 w-3 bg-purple-500"></span>
        </div>
        <div>
          <h3 class="text-sm font-semibold tracking-wider text-slate-200 uppercase">EVA.cat</h3>
          <p class="text-[10px] text-purple-400 font-mono tracking-widest">
            Nine lives, infinite knowledge
          </p>
        </div>
      </div>

      <div class="flex gap-1.5">
        <!-- Reset Button -->
        <button
          type="button"
          [attr.data-tooltip]="'Reset'"
          data-tooltip-position="bottom"
          aria-label="Reset"
          (click)="resetConnection()"
          class="w-10 h-10 sm:w-11 sm:h-11 relative rounded-full bg-purple-500/10 hover:bg-purple-500 text-purple-400 hover:text-slate-900 border border-purple-500/20 hover:border-purple-400 disabled:opacity-20 disabled:hover:bg-transparent disabled:text-slate-600 transition-all duration-200 hover:scale-105 active:scale-95 cursor-pointer shadow-lg flex items-center justify-center"
        >
          <span class="material-symbols-outlined text-[20px] sm:text-[22px]">restart_alt</span>
        </button>

        <button
          type="button"
          [attr.data-tooltip]="'Close Chat'"
          data-tooltip-position="bottom"
          (click)="isCloseModal.emit(true)"
          class="w-10 h-10 sm:w-11 sm:h-11 relative rounded-full bg-slate-800/50 hover:bg-rose-500/20 text-slate-400 hover:text-rose-400 border border-slate-700/50 hover:border-rose-500/30 disabled:opacity-20 disabled:hover:bg-transparent disabled:text-slate-600 transition-all duration-200 hover:scale-105 active:scale-95 cursor-pointer shadow-lg flex items-center justify-center"
          aria-label="Close chat modal"
          [attr.aria-expanded]="show()"
        >
          <span class="material-symbols-outlined text-[20px] sm:text-[22px]">close</span>
        </button>
      </div>
    </div>
    @if (isChatSelected()) {
      <app-chat #chatModal class="flex-1 flex flex-col min-h-0" />
    } @else if (isTalkSelected()) {
      <app-talk #talkModal class="flex-1 flex flex-col min-h-0" (openChat)="openChatModal($event)"/>
    } @else {
      <div class="flex-1 flex flex-col items-center justify-center p-6 text-center min-h-0">
        <!-- Primary Prompt -->
        <p class="text-sm font-medium text-slate-200 tracking-wide mb-2">
          Select a mode to continue
        </p>

        <!-- Selection Subtext -->
        <p class="text-xs text-slate-400 tracking-normal">
          <span
            (click)="isChatSelected.set(true)"
            (keydown.enter)="isChatSelected.set(true)"
            tabindex="0"
            class="inline-block px-1.5 py-0.5 rounded bg-purple-500/10 hover:bg-purple-500/20 text-purple-400 font-semibold cursor-pointer transition-all duration-200 hover:scale-105 focus:outline-none focus:ring-1 focus:ring-purple-500"
            >chat</span
          >

          <span class="mx-1">or</span>

          <span
            (click)="isTalkSelected.set(true)"
            (keydown.enter)="isTalkSelected.set(true)"
            tabindex="0"
            class="inline-block px-1.5 py-0.5 rounded bg-purple-500/10 hover:bg-purple-500/20 text-purple-400 font-semibold cursor-pointer transition-all duration-200 hover:scale-105 focus:outline-none focus:ring-1 focus:ring-purple-500"
            >talk</span
          >

          <span class="ml-1 text-slate-300 font-mono text-[11px] opacity-80">with EVA.cat</span>
        </p>
      </div>
    }
  </div>
}
