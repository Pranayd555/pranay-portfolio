<!-- IMMERSIVE THREE.JS HOLOGRAPHIC CANVAS (Middle Section) -->
<div class="relative flex-1 w-full bg-slate-950/40 flex flex-col items-center justify-center overflow-hidden min-h-0">
  
  <!-- Ambient Underlying Glow Layer -->
  <div class="absolute inset-0 pointer-events-none bg-radial-gradient from-purple-500/5 via-transparent to-transparent blur-3xl"></div>
  
  <!-- WebGL Render Node -->
  <canvas #threeCanvas class="absolute inset-0 w-full h-full block z-0"></canvas>
  
  <!-- Immersive Subtext Display Overlay -->
  <div class="absolute inset-x-6 z-10 flex flex-col items-center text-center space-y-3 select-none">
    @if (userTranscript()) {
      <p class="text-slate-300 text-xs sm:text-sm font-mono px-4 py-2 rounded-xl bg-slate-950/60 backdrop-blur-md border border-purple-500/10 max-w-[90%] truncate shadow-md animate-fade-in">
        “ {{ userTranscript() }} ”
      </p>
    }
    @else if (evaResponseText()) {
      <p class="text-purple-300 text-xs sm:text-sm font-mono px-4 py-2 rounded-xl bg-purple-950/40 backdrop-blur-md border border-purple-500/20 max-w-[90%] shadow-purple-500/5 shadow-lg line-clamp-3 text-center animate-fade-in">
        {{ evaResponseText() }}
      </p>
    } @else {
      <p class="text-purple-300 text-xs sm:text-sm font-mono px-4 py-2 rounded-xl bg-purple-950/40 backdrop-blur-md border border-purple-500/20 max-w-[90%] shadow-purple-500/5 shadow-lg line-clamp-3 text-center animate-fade-in">
        Eva is practicing her voice.
        For now, type to 
        <span
          (click)="openChat.emit(true)"
          (keydown.enter)="openChat.emit(true)"
          class="animate-pulse cursor-pointer hover:opacity-100 hover:underline"
          >chat...</span
        >
      </p>
    }
  </div>

  <!-- Top Floating HUD State Badge -->
  <!-- <div class="absolute top-6 z-10 pointer-events-none select-none">
    <span class="text-[10px] font-mono tracking-widest uppercase text-purple-400 bg-purple-500/10 px-3 py-1.5 rounded-full border border-purple-500/20 shadow-sm backdrop-blur-sm">
      System.Eva.exe: {{ talkState() }}
    </span>
  </div>
</div> -->
