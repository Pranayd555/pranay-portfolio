@if (show()) {
  <div
    class="fixed z-50 left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-full max-w-[calc(100vw-2rem)] h-[85vh] max-h-[calc(100vh-2rem)] bg-slate-900/80 backdrop-blur-xl border border-purple-500/20 rounded-2xl shadow-[0_0_50px_-12px_rgba(168,85,247,0.2)] flex flex-col overflow-hidden md:left-auto md:top-24 md:right-24 md:bottom-auto md:translate-x-0 md:translate-y-0 md:w-auto md:max-w-lg md:h-[600px]"
  >
    <div
      class="h-[2px] w-full bg-gradient-to-r from-transparent via-purple-500 to-cyan-400 absolute top-0 left-0 animate-pulse"
    ></div>

    <div
      class="px-5 py-3 md:px-6 md:py-4 border-b border-slate-800 flex items-center justify-between bg-slate-950/40"
    >
      <div class="flex items-center gap-3">
        <div class="relative flex h-3 w-3">
          <span
            class="animate-ping absolute inline-flex h-full w-full rounded-full bg-purple-400 opacity-75"
          ></span>
          <span class="relative inline-flex rounded-full h-3 w-3 bg-purple-500"></span>
        </div>
        <div>
          <h3 class="text-sm font-semibold tracking-wider text-slate-200 uppercase">EVA.exe</h3>
          <p class="text-[10px] text-purple-400 font-mono tracking-widest">
            KNOWLEDGE MATRIX ONLINE
          </p>
        </div>
      </div>

      <div class="flex gap-1.5">
        <button
          type="button"
          [attr.data-tooltip]="'Reset'"
          data-tooltip-position="bottom"
          aria-label="Reset"
          (click)="resetConnection()"
          [disabled]="messages().length === 0"
          class="w-full relative sm:w-auto h-12 rounded-2xl bg-purple-600/10 hover:bg-purple-600 text-purple-400 hover:text-white border border-purple-500/20 hover:border-purple-400 disabled:opacity-20 disabled:hover:bg-transparent disabled:text-slate-600 transition-all duration-300 cursor-pointer shadow-md flex items-center justify-center px-4"
        >
          <span class="material-symbols-outlined t-chevron">restart_alt</span>
        </button>
      </div>
    </div>

    <div
      #scrollContainer
      class="flex-1 flex-col flex-1 overflow-y-auto p-4 md:p-6 space-y-4 scroll-smooth custom-scrollbar"
    >
      @for (msg of messages(); track msg.id) {
        <div
          class="flex w-full animate-fade-in"
          [ngClass]="{ 'justify-end': msg.sender === 'user' }"
        >
          <div
            class="max-w-[90%] md:max-w-[78%] rounded-xl px-4 py-3 text-sm tracking-wide leading-relaxed shadow-lg border"
            [ngClass]="{
              'bg-gradient-to-br from-purple-950/40 to-slate-900/90 border-purple-500/30 text-purple-200 rounded-tl-none shadow-purple-500/5':
                msg.sender === 'bot',
              'bg-gradient-to-br from-slate-800 to-slate-900 border-slate-700 text-slate-100 rounded-tr-none shadow-black/40':
                msg.sender === 'user',
            }"
          >
            <div class="text-[10px] font-mono mb-1 opacity-40 uppercase tracking-wider">
              {{ msg.sender === 'bot' ? 'Eva' : 'you' }}
            </div>

            <p class="font-mono text-[13px] whitespace-pre-wrap selection:bg-purple-500/50">
              {{ msg.text }}
            </p>
          </div>
        </div>
      }

      @if (isResetting()) {
        <div class="flex w-full justify-center items-center h-52 animate-fade-in">
          <div
            class="bg-purple-950/20 border border-purple-500/20 text-purple-300 rounded-xl px-4 py-3 md:px-5 md:py-4 shadow-lg flex items-center gap-3"
          >
            <span
              class="w-2 h-2 bg-purple-400 rounded-full animate-bounce"
              style="animation-delay: 0ms"
            ></span>
            <span
              class="w-2 h-2 bg-purple-400 rounded-full animate-bounce"
              style="animation-delay: 150ms"
            ></span>
            <span
              class="w-2 h-2 bg-purple-400 rounded-full animate-bounce"
              style="animation-delay: 300ms"
            ></span>
            <span class="text-sm font-mono opacity-80">Resetting connection…</span>
          </div>
        </div>
      }

      @if (isTyping()) {
        <div class="flex w-full justify-start animate-fade-in">
          <div
            class="bg-purple-950/20 border border-purple-500/20 text-purple-300 rounded-xl rounded-tl-none px-4 py-3 md:px-5 md:py-4 shadow-lg flex items-center gap-1.5"
          >
            <span
              class="w-1.5 h-1.5 bg-purple-400 rounded-full animate-bounce"
              style="animation-delay: 0ms"
            ></span>
            <span
              class="w-1.5 h-1.5 bg-purple-400 rounded-full animate-bounce"
              style="animation-delay: 150ms"
            ></span>
            <span
              class="w-1.5 h-1.5 bg-purple-400 rounded-full animate-bounce"
              style="animation-delay: 300ms"
            ></span>
          </div>
        </div>
      }

      @if (isReconnecting()) {
        <p #ReconnectText
          class="text-[10px] font-mono text-white opacity-40 uppercase tracking-wider mt-auto pt-4"
        > I am a sleppy cat, please
          <span (click)="reconnectChat()" (keydown.enter)="reconnectChat()" class=" animate-pulse cursor-pointer hover:opacity-100 hover:underline"
            >wake me</span
          >
          up
        </p>
      }
    </div>

    <div class="p-3 sm:p-4 bg-slate-950/60 border-t border-slate-800/80 backdrop-blur-md">
      <div
        class="flex flex-col gap-3 sm:flex-row sm:items-center bg-slate-900/90 border border-slate-800 focus-within:border-purple-500/50 rounded-2xl px-3 py-3 sm:px-3.5 sm:py-2 transition-all duration-300 group shadow-inner"
      >
        <input
          type="text"
          [ngModel]="userInput()"
          (ngModelChange)="userInput.set($event)"
          (keyup.enter)="sendMessage()"
          placeholder="Query Pranay's knowledge base..."
          class="w-full sm:flex-1 min-w-0 bg-transparent border border-slate-800/70 rounded-2xl px-4 py-3 text-slate-200 text-sm font-mono placeholder-slate-500 focus:border-purple-500/70 focus:outline-none focus:ring-2 focus:ring-purple-500/20"
        />

        <div class="flex w-full gap-2 sm:w-auto sm:flex-row sm:items-center">
          <button
            type="button"
            (click)="sendMessage()"
            [attr.data-tooltip]="'Send'"
            aria-label="Send"
            [disabled]="!userInput().trim() || isStreaming()"
            class="w-full relative sm:w-auto h-12 rounded-2xl bg-purple-600/10 hover:bg-purple-600 text-purple-400 hover:text-white border border-purple-500/20 hover:border-purple-400 disabled:opacity-20 disabled:hover:bg-transparent disabled:text-slate-600 transition-all duration-300 cursor-pointer shadow-md flex items-center justify-center px-4"
          >
            <span class="material-symbols-outlined t-chevron">send</span>
          </button>
          <button
            type="button"
            [attr.data-tooltip]="'Close Chat'"
            aria-label="Close Chat"
            (click)="closeModal()"
            class="w-full relative sm:w-12 h-12 rounded-2xl bg-slate-800/90 text-slate-300 border border-slate-700 hover:bg-slate-700 hover:text-white transition-all duration-300 shadow-sm cursor-pointer hover:border-purple-400"
            aria-label="Close chat modal"
            [attr.aria-expanded]="show()"
          >
            <span class="material-symbols-outlined t-chevron mt-1">close</span>
          </button>
        </div>
      </div>
    </div>
  </div>
}
